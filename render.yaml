# Configuración de Render (https://render.com) para el VGR Donation Tracker.
# Si el servicio ya existe en Render, solo copia buildCommand/startCommand y las env vars
# en Dashboard → tu servicio → Settings. Los secretos se escriben a mano en el dashboard.
services:
  - type: web
    name: vgr-donation-tracker
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # Públicas (mismas valores que .env, seguras de commit)
      - key: SUPABASE_URL
        value: https://iaysswqvpbycocawjsgf.supabase.co
      - key: SUPABASE_PROJECT_ID
        value: iaysswqvpbycocawjsgf
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_Fti8qhnfDnWYwDujnvPyYA_kNtvwZaQ
      - key: VITE_SUPABASE_URL
        value: https://iaysswqvpbycocawjsgf.supabase.co
      - key: VITE_SUPABASE_PROJECT_ID
        value: iaysswqvpbycocawjsgf
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_Fti8qhnfDnWYwDujnvPyYA_kNtvwZaQ
      # Secretas: se definen en el dashboard (Dashboard → Environment → Add Environment Variable)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Solo cuando se configure WhatsApp (ver CONFIGURACION.md):
      # - key: WHATSAPP_API_KEY
      #   sync: false
      # - key: WHATSAPP_PHONE_NUMBER_ID
      #   sync: false
      # - key: WHATSAPP_APP_SECRET
      #   sync: false
      # - key: WHATSAPP_VERIFY_TOKEN
      #   sync: false
      # - key: WHATSAPP_ADMIN_NUMBER
      #   value: "51951012633"
      # - key: WHATSAPP_TEMPLATE_NAME
      #   sync: false
